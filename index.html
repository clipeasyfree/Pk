<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATELIER CLIP // Studio Prestige</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Cinzel', 'serif'],
            mono: ['"Space Mono"', 'monospace'],
          },
          colors: {
            gold: { 300: '#F7E7A9', 400: '#E6CA65', 500: '#D4AF37', 600: '#AA820A' },
            onyx: { 950: '#050608', 900: '#090B0E', 850: '#0F1217', 800: '#161B22', 700: '#232A36' }
          }
        }
      }
    }
  </script>
  <style>
    .gold-glow { box-shadow: 0 0 35px -8px rgba(212, 175, 55, 0.25); }
    .gold-text-glow { text-shadow: 0 0 16px rgba(247, 231, 169, 0.45); }
    .gold-border { border: 1px solid rgba(212, 175, 55, 0.3); }
  </style>
</head>
<body class="bg-[#050608] text-slate-200 min-h-screen font-sans antialiased selection:bg-gold-500 selection:text-black">

  <header class="border-b border-white/[0.06] bg-onyx-950/80 backdrop-blur-xl sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-gold-400 via-gold-500 to-gold-600 flex items-center justify-center text-onyx-950 font-display font-black text-xl shadow-lg shadow-gold-500/20">
          ✦
        </div>
        <div>
          <span class="font-display font-bold tracking-widest text-lg text-white">CLIP<span class="text-gold-400">STUDIO</span></span>
          <p class="text-[10px] text-slate-400 font-mono">1-Click Automated Shorts Machine</p>
        </div>
      </div>
      <button id="btnSettings" class="px-3 py-1.5 rounded-lg bg-onyx-900 border border-white/[0.1] text-xs font-mono text-gold-400 hover:border-gold-500 transition">
        ⚙ Settings
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-6 py-10 space-y-8">

    <!-- 1. Input Box -->
    <div class="bg-onyx-900/90 border gold-border rounded-2xl p-6 shadow-2xl space-y-4">
      <label class="text-xs font-mono uppercase tracking-widest text-gold-400 block">1. YouTube Video URL</label>
      <input type="text" id="urlInput" placeholder="Paste link: https://www.youtube.com/watch?v=..." class="w-full bg-onyx-950 border border-white/[0.1] rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-600 font-mono focus:outline-none focus:border-gold-500">
    </div>

    <!-- 2. Timestamps -->
    <div class="bg-onyx-900/90 border border-white/[0.08] rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center">
        <label class="text-xs font-mono uppercase tracking-widest text-gold-400">2. Clip Moments</label>
        <button id="btnAddClip" class="text-xs font-mono text-gold-400 hover:underline">+ Add Clip</button>
      </div>
      <div id="clipsList" class="space-y-3">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- 3. Big Generate Button -->
    <button id="btnGenerate" class="w-full py-4 rounded-xl bg-gradient-to-r from-gold-400 via-gold-500 to-gold-600 hover:from-gold-300 hover:to-gold-500 text-onyx-950 font-display font-black text-sm uppercase tracking-[0.25em] shadow-xl shadow-gold-500/25 transition active:scale-[0.99]">
      ⚡ Generate & Download Clips
    </button>

    <!-- 4. Real-time In-Page Status & Downloads -->
    <div id="statusSection" class="bg-onyx-900/90 border border-white/[0.08] rounded-2xl p-6 shadow-2xl hidden space-y-4">
      <div class="flex items-center justify-between">
        <span class="text-xs font-mono uppercase tracking-widest text-gold-400">Status</span>
        <span id="statusBadge" class="text-xs px-2.5 py-1 rounded bg-gold-500/10 text-gold-300 font-mono border border-gold-500/30 animate-pulse">Processing...</span>
      </div>
      <p id="statusMsg" class="text-sm text-slate-300 font-mono">Job dispatched. Waiting for runner to encode...</p>

      <!-- Download Button Container (Appears when ready) -->
      <div id="downloadContainer" class="pt-4 border-t border-white/[0.08] hidden space-y-2">
        <h4 class="text-xs font-mono text-slate-400 uppercase">Your Finished Video is Ready:</h4>
        <a id="downloadLink" href="#" target="_blank" class="inline-flex items-center space-x-2 px-6 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-sm shadow-lg transition">
          <span>⬇ Download Finished 9:16 Short (.ZIP)</span>
        </a>
      </div>
    </div>

  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-onyx-900 border gold-border rounded-2xl max-w-md w-full p-6 space-y-4">
      <h3 class="text-sm font-mono text-gold-400 uppercase">GitHub Token Setup</h3>
      <p class="text-xs text-slate-400">Required once so this webpage has permission to trigger jobs and fetch download links.</p>
      <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full bg-onyx-950 border border-white/[0.1] rounded-lg p-2.5 text-xs text-slate-200 font-mono focus:border-gold-500">
      <button id="btnSaveSettings" class="w-full py-2.5 bg-gold-500 hover:bg-gold-400 text-black font-bold text-xs rounded-lg uppercase font-mono">
        Save Token
      </button>
    </div>
  </div>

  <script>
    const clips = [
      { id: 1, start: "03:00", end: "03:34", label: "Clip 1" },
      { id: 2, start: "11:55", end: "12:41", label: "Clip 2" }
    ];

    function renderClips() {
      const el = document.getElementById('clipsList');
      el.innerHTML = '';
      clips.forEach((c, i) => {
        el.innerHTML += `
          <div class="flex items-center space-x-2 bg-onyx-950 p-3 rounded-xl border border-white/[0.06]">
            <span class="text-xs font-mono text-gold-400 w-12">${c.label}</span>
            <input type="text" value="${c.start}" onchange="clips[${i}].start=this.value" class="w-20 bg-onyx-900 border border-white/[0.08] rounded-lg px-2 py-1 text-xs text-center font-mono">
            <span class="text-slate-600 text-xs">➔</span>
            <input type="text" value="${c.end}" onchange="clips[${i}].end=this.value" class="w-20 bg-onyx-900 border border-white/[0.08] rounded-lg px-2 py-1 text-xs text-center font-mono">
          </div>
        `;
      });
    }

    document.getElementById('btnAddClip').onclick = () => {
      clips.push({ id: clips.length + 1, start: "00:00", end: "00:30", label: `Clip ${clips.length + 1}` });
      renderClips();
    };

    document.getElementById('btnSettings').onclick = () => document.getElementById('settingsModal').classList.remove('hidden');
    document.getElementById('btnSaveSettings').onclick = () => {
      localStorage.setItem('autoclip_token', document.getElementById('tokenInput').value.trim());
      document.getElementById('settingsModal').classList.add('hidden');
    };

    document.getElementById('btnGenerate').onclick = async () => {
      const url = document.getElementById('urlInput').value.trim();
      const token = localStorage.getItem('autoclip_token');
      if (!url) return alert("Paste a YouTube link first.");
      if (!token) return document.getElementById('settingsModal').classList.remove('hidden');

      const statusSection = document.getElementById('statusSection');
      const statusBadge = document.getElementById('statusBadge');
      const statusMsg = document.getElementById('statusMsg');
      const downloadContainer = document.getElementById('downloadContainer');
      const downloadLink = document.getElementById('downloadLink');

      statusSection.classList.remove('hidden');
      downloadContainer.classList.add('hidden');
      statusBadge.innerText = "Dispatching...";
      statusMsg.innerText = "Triggering backend runner...";

      try {
        // 1. Dispatch job
        await fetch("https://api.github.com/repos/clipeasyfree/Pk/dispatches", {
          method: "POST",
          headers: { "Accept": "application/vnd.github.v3+json", "Authorization": `Bearer ${token}` },
          body: JSON.stringify({ event_type: "start-render", client_payload: { url, timestamps: clips, preset: "white-gold" } })
        });

        statusBadge.innerText = "Encoding Video...";
        statusMsg.innerText = "Processing timestamps with Whisper & FFmpeg. Checking for download link...";

        // 2. Poll GitHub automatically every 10 seconds until completed
        const interval = setInterval(async () => {
          const res = await fetch("https://api.github.com/repos/clipeasyfree/Pk/actions/runs?per_page=1", {
            headers: { "Authorization": `Bearer ${token}` }
          });
          const data = await res.json();
          const run = data.workflow_runs?.[0];

          if (run && run.status === "completed") {
            clearInterval(interval);
            if (run.conclusion === "success") {
              // Fetch artifacts
              const artRes = await fetch(run.artifacts_url, { headers: { "Authorization": `Bearer ${token}` } });
              const artData = await artRes.json();
              const artifact = artData.artifacts?.[0];

              statusBadge.className = "text-xs px-2.5 py-1 rounded bg-emerald-500/10 text-emerald-400 font-mono border border-emerald-500/30";
              statusBadge.innerText = "Complete ✓";
              statusMsg.innerText = "Your clips are ready!";

              downloadLink.href = `https://github.com/clipeasyfree/Pk/actions/runs/${run.id}`;
              downloadContainer.classList.remove('hidden');
            } else {
              statusBadge.className = "text-xs px-2.5 py-1 rounded bg-red-500/10 text-red-400 font-mono";
              statusBadge.innerText = "Failed ✕";
              statusMsg.innerText = "Encoding failed. Check python worker logs.";
            }
          }
        }, 10000);

      } catch (err) {
        statusMsg.innerText = "Error: " + err.message;
      }
    };

    renderClips();
  </script>
</body>
</html>
