<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VERTEX ULTRA PRO // Real AI Short-Form Repurposer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #06070B; color: #F1F5F9; font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-panel { background: rgba(17, 21, 37, 0.45); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-item { background: rgba(22, 28, 48, 0.4); border: 1px solid rgba(255, 255, 255, 0.06); }
    .ambient-glow { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); width: 380px; height: 380px; background: radial-gradient(circle, rgba(0, 240, 255, 0.15) 0%, transparent 75%); filter: blur(60px); pointer-events: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 relative">
  <div class="ambient-glow"></div>

  <div class="max-w-md mx-auto w-full space-y-4 pt-2 relative z-10">
    <!-- Header -->
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-2.5">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-[#00F0FF] to-[#0072FF] text-black font-black flex items-center justify-center shadow-lg">◈</div>
        <div>
          <span class="text-sm font-black tracking-wider text-white">VERTEX<span class="text-[#00F0FF]">PRO</span></span>
          <p class="text-[10px] text-slate-400">Transcript-Driven AI Repurposer</p>
        </div>
      </div>
      <button id="btnSettings" class="w-8 h-8 rounded-xl glass-item flex items-center justify-center text-xs text-slate-300">⚙</button>
    </div>

    <!-- Main Card -->
    <div class="glass-panel rounded-3xl p-5 space-y-4 shadow-2xl">
      <div>
        <label class="text-[10px] font-mono uppercase text-slate-400 block mb-1">YouTube Video Link</label>
        <input type="text" id="inputUrl" placeholder="https://www.youtube.com/watch?v=..." class="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-2.5 text-xs font-mono text-white focus:outline-none focus:border-[#00F0FF]">
      </div>

      <div>
        <label class="text-[10px] font-mono uppercase text-slate-400 block mb-1">Campaign Instructions</label>
        <textarea id="inputInstructions" rows="2" class="w-full bg-black/40 border border-white/10 rounded-xl p-2.5 text-xs font-mono text-white focus:outline-none focus:border-[#00F0FF]">Cold-open punchlines, complete thoughts, high tension moments. Never cut mid-sentence.</textarea>
      </div>

      <div class="flex items-center justify-between bg-black/30 p-2.5 rounded-xl border border-white/5">
        <span class="text-[10px] font-mono text-slate-300">Quality:</span>
        <select id="selectQuality" class="glass-item text-[11px] font-mono text-[#00F0FF] rounded-lg px-2 py-1">
          <option value="balanced" selected>💎 Balanced HD (1080p)</option>
          <option value="fast">⚡ Turbo Mobile (720p)</option>
          <option value="master">👑 Studio Master (1080p CRF 16)</option>
        </select>
      </div>

      <div class="bg-black/20 p-3 rounded-xl border border-white/5 text-[10px] font-mono text-slate-400 space-y-1">
        <div>✓ Pulls YouTube's full word-by-word transcript.</div>
        <div>✓ Feeds actual spoken dialogue to Gemini AI.</div>
        <div>✓ Cuts genuine complete thoughts (no fake continuous chops).</div>
      </div>

      <button id="btnStart" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-emerald-400 to-teal-500 text-black font-extrabold text-xs uppercase tracking-widest flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
        <span>⚡ Extract & Render Real Viral Clips</span>
      </button>
    </div>

    <!-- Progress Card -->
    <div id="progressBox" class="glass-panel rounded-3xl p-5 space-y-3 hidden">
      <div class="flex justify-between text-xs font-mono">
        <span id="statusText" class="text-white">Starting runner...</span>
        <span id="pctText" class="text-[#00F0FF]">0%</span>
      </div>
      <div class="w-full bg-black/50 h-2 rounded-full overflow-hidden">
        <div id="pBar" class="h-full bg-gradient-to-r from-[#00F0FF] to-emerald-400 w-0 transition-all duration-300"></div>
      </div>
      <div id="dlArea" class="hidden pt-2">
        <a id="btnDl" href="#" target="_blank" class="w-full py-3 bg-gradient-to-r from-[#00F0FF] to-[#0072FF] text-black font-mono font-bold text-xs uppercase rounded-xl flex items-center justify-center gap-2 shadow-lg">
          ⬇ Download Real AI Clips (.ZIP)
        </a>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="modalSettings" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
    <div class="glass-panel rounded-3xl max-w-sm w-full p-5 space-y-3">
      <div class="flex justify-between items-center">
        <h3 class="text-xs font-mono font-bold text-[#00F0FF] uppercase">Settings</h3>
        <button id="btnCloseSettings" class="text-slate-400 text-xs">✕</button>
      </div>
      <label class="text-[10px] font-mono text-slate-400 block uppercase">GitHub Token:</label>
      <input type="password" id="inputGhToken" placeholder="ghp_..." class="w-full bg-black/40 border border-white/10 rounded-xl p-2.5 text-xs font-mono text-white">
      <button id="btnSaveSettings" class="w-full py-2 bg-[#00F0FF] text-black font-bold text-xs rounded-xl uppercase font-mono">Save</button>
    </div>
  </div>

  <script>
    document.getElementById('btnSettings').onclick = () => {
      document.getElementById('inputGhToken').value = localStorage.getItem('autoclip_token') || '';
      document.getElementById('modalSettings').classList.remove('hidden');
    };
    document.getElementById('btnCloseSettings').onclick = () => document.getElementById('modalSettings').classList.add('hidden');
    document.getElementById('btnSaveSettings').onclick = () => {
      localStorage.setItem('autoclip_token', document.getElementById('inputGhToken').value.trim());
      document.getElementById('modalSettings').classList.add('hidden');
    };

    document.getElementById('btnStart').onclick = async () => {
      const url = document.getElementById('inputUrl').value.trim();
      const token = localStorage.getItem('autoclip_token');
      if (!url) return alert('Enter a YouTube URL');
      if (!token) return document.getElementById('btnSettings').click();

      const pBox = document.getElementById('progressBox');
      const sText = document.getElementById('statusText');
      const pText = document.getElementById('pctText');
      const pBar = document.getElementById('pBar');
      const dlArea = document.getElementById('dlArea');
      const btnDl = document.getElementById('btnDl');

      pBox.classList.remove('hidden');
      dlArea.classList.add('hidden');
      pBar.style.width = '10%';
      pText.innerText = '10%';
      sText.innerText = 'Dispatching to GitHub runner...';

      await fetch("https://api.github.com/repos/clipeasyfree/Pk/dispatches", {
        method: "POST",
        headers: { "Accept": "application/vnd.github.v3+json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({
          event_type: "start-render",
          client_payload: {
            url: url,
            instructions: document.getElementById('inputInstructions').value,
            quality: document.getElementById('selectQuality').value
          }
        })
      });

      let pollTimer = setInterval(async () => {
        const res = await fetch("https://api.github.com/repos/clipeasyfree/Pk/actions/runs?per_page=1", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        const run = data.workflow_runs?.[0];

        if (run) {
          if (run.status === "in_progress") {
            pBar.style.width = '65%';
            pText.innerText = '65%';
            sText.innerText = 'Extracting transcript & reading dialogue with Gemini...';
          } else if (run.status === "completed") {
            clearInterval(pollTimer);
            if (run.conclusion === "success") {
              pBar.style.width = '100%';
              pText.innerText = '100%';
              sText.innerText = '✓ Genuine clips ready!';
              btnDl.href = `https://nightly.link/clipeasyfree/Pk/actions/runs/${run.id}/capcut-ready-clips.zip`;
              dlArea.classList.remove('hidden');
            } else {
              sText.innerText = 'Error in runner. Check Actions log.';
              pBar.className = 'h-full bg-red-500';
            }
          }
        }
      }, 3500);
    };
  </script>
</body>
</html>
