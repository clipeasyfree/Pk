name: AutoClip Render Pipeline

on:
  repository_dispatch:
    types: [start-render]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg & Deno
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Download High-Precision YuNet Face Detector
        run: |
          mkdir -p models
          curl -sL "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" -o models/face_detection_yunet.onnx

      - name: Install Video Processing Libraries
        run: |
          pip install --upgrade pip
          pip install yt-dlp yt-dlp-ejs "opencv-python-headless==4.10.0.84" numpy

      - name: Run Auto-Framing Engine
        env:
          JOB_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          COOKIES_DATA: ${{ secrets.YT_COOKIES }}
        run: |
          python worker.py

      - name: Upload Finished Shorts Package
        uses: actions/upload-artifact@v4
        with:
          name: autoclip-shorts
          path: output/*.mp4
          retention-days: 7
