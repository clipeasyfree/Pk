name: AutoClip Render Pipeline

on:
  repository_dispatch:
    types: [start-render]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies, Deno & Studio Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl fontconfig
          # 1. Install Deno (Solves YouTube JS challenges)
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          # 2. Download and register fonts system-wide
          mkdir -p fonts
          sudo mkdir -p /usr/local/share/fonts/studio
          curl -sL "https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf" -o fonts/Anton.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/montserrat/static/Montserrat-Black.ttf" -o fonts/Montserrat.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/static/PlayfairDisplay-BoldItalic.ttf" -o fonts/PlayfairDisplay.ttf
          curl -sL "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/static/PlayfairDisplay-Black.ttf" -o fonts/PlayfairDisplay-Black.ttf
          sudo cp fonts/*.ttf /usr/local/share/fonts/studio/
          sudo fc-cache -f -v

      - name: Install Python AI Libraries
        run: |
          pip install --upgrade pip
          pip install --upgrade yt-dlp yt-dlp-ejs faster-whisper

      - name: Run Clipping Engine
        env:
          JOB_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          COOKIES_DATA: ${{ secrets.YT_COOKIES }}
        run: |
          python worker.py

      - name: Upload Finished Shorts Package
        uses: actions/upload-artifact@v4
        with:
          name: autoclip-shorts
          path: output/*.mp4
          retention-days: 7
