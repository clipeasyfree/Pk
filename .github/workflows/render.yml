name: render

on:
  repository_dispatch:
    types: [start-render]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Setup Deno Engine
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Install Video Extraction Engine
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp

      - name: Download & Slice High-Res Clips
        env:
          JOB_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          COOKIES_DATA: ${{ secrets.YT_COOKIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python worker.py

      - name: Upload Finished Clips Package
        uses: actions/upload-artifact@v4
        with:
          name: capcut-ready-clips
          path: output/
          if-no-files-found: error
