name: AutoClip Render Pipeline

on:
  repository_dispatch:
    types: [start-render]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg and Deno (JS Runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install --upgrade yt-dlp yt-dlp-ejs faster-whisper
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Clipping Engine
        env:
          JOB_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          COOKIES_DATA: ${{ secrets.YT_COOKIES }}
        run: |
          python worker.py

      - name: Upload Output Clips Artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoclip-shorts
          path: output/*.mp4
          retention-days: 2
