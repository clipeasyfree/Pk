name: AutoClip Render Pipeline

on:
  repository_dispatch:
    types: [start-render]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Setup Deno Engine
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install Video Extraction Engine
        run: |
          pip install --upgrade pip
          pip install yt-dlp yt-dlp-ejs

      - name: Download & Slice High-Res Clips
        env:
          JOB_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          COOKIES_DATA: ${{ secrets.YT_COOKIES }}
        run: |
          python worker.py

      - name: Upload Finished Clips Package
        uses: actions/upload-artifact@v4
        with:
          name: capcut-ready-clips
          path: output/*.mp4
          retention-days: 7
